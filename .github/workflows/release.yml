# main 브랜치에 푸시할 때마다 EXE를 빌드해 새 Release(v1.0.{빌드번호})로 올림
# 앱의 "업데이트 확인"이 이 Release의 GameTuner.exe를 받아 자기 자신을 교체함
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}   # 메이저/마이너를 올리려면 앞의 1.0만 바꾸면 됨
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish GameTuner.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GameTuner ${{ env.VERSION }}
          files: out/GameTuner.exe
          generate_release_notes: true
